set-option -g history-limit 100000

set-option -g default-shell /usr/bin/fish

unbind C-b
set -g prefix C-space
bind C-space send-prefix

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard &> /dev/null'
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Enter send-keys -X cancel
bind Escape copy-mode
bind y copy-mode

bind -n F1 if-shell -F '#{==:#{session_name},scratch}' {
    detach-client
} {
    popup -d '#{pane_current_path}' -E -h 35% -w 100% -y 65% 'tmux attach -t scratch || tmux new -s scratch'
}

bind e if-shell 'tmux has-session -t default 2>/dev/null' {
    run-shell "tmux switch-client -t default"
}

bind i run "[[ $(($(tmux display -p '8*#{pane_width}-20*#{pane_height}'))) -lt 0 ]] && tmux splitw -v -c '#{pane_current_path}' || tmux splitw -h -c '#{pane_current_path}'"

# Vi mode
set -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key < swap-window -t -1 \; select-window -t -1
bind-key > swap-window -t +1 \; select-window -t +1

bind % split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

bind Left resize-pane -L 2
bind Right resize-pane -R 2
bind Up resize-pane -U 2
bind Down resize-pane -D 2

bind x kill-pane

# remove vim mode switching delay
set -s escape-time 0
set -g repeat-time 1000
set -g focus-events on
setw -g aggressive-resize on
bind R source-file "$HOME/.config/tmux/tmux.conf"

set -g set-titles on
set -g set-titles-string "#T"

set -g mouse off

set -g update-environment "SSH_AUTH_SOCK"

set -g status-right ''
set -g status-right-length 0
set-option -g status-style "fg=#777777 bg=#111111"
